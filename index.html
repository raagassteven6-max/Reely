<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReelTest – Movie Streaming Demo</title>
<meta name="description" content="A test web app for browsing and streaming public-domain films, with TMDB metadata.">
<style>
:root{--bg:#0e0f13;--card:#181a21;--text:#eceef3;--mute:#9aa0ae;--acc:#e5484d}
@media(prefers-color-scheme:light){:root{--bg:#f6f6f8;--card:#fff;--text:#16171c;--mute:#5b6070}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:12px;align-items:center;padding:12px 16px;flex-wrap:wrap;border-bottom:1px solid #8883}
h1{font-size:1.2rem;margin:0;color:var(--acc)}
input{flex:1;min-width:160px;padding:9px 12px;border-radius:8px;border:1px solid #8886;background:var(--card);color:var(--text)}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--acc);color:#fff;cursor:pointer}
main{padding:16px;max-width:1100px;margin:auto}
h2{font-size:1.1rem;margin:24px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#8883}
.card p{margin:0;padding:8px;font-size:.85rem}
.card small{color:var(--mute);display:block}
#player{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#player.on{display:flex}
.box{width:100%;max-width:900px}
.box iframe{width:100%;aspect-ratio:16/9;border:0;background:#000}
.box h3{color:#fff;margin:0 0 8px}
.msg{color:var(--mute)}
footer{padding:24px 16px;text-align:center;color:var(--mute);font-size:.8rem}
</style>
</head>
<body>
<header>
  <h1>ReelTest</h1>
  <input id="q" placeholder="Search public-domain films…">
  <button id="go">Search</button>
</header>
<main>
  <h2>Public-domain films</h2>
  <div id="films" class="grid"><p class="msg">Loading…</p></div>
  <section id="tmdbSec" hidden>
    <h2>Trending (TMDB metadata)</h2>
    <div id="tmdb" class="grid"></div>
  </section>
</main>
<div id="player"><div class="box"><h3 id="pt"></h3><iframe id="pf" allowfullscreen></iframe><button id="close" style="margin-top:10px">Close</button></div></div>
<footer>
  Films stream from the Internet Archive (public domain). <br>
  This product uses the TMDB API but is not endorsed or certified by TMDB.
</footer>
<script>
// Paste your TMDB v3 API key here once you have it (leave empty to hide the section).
const TMDB_KEY = "";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function loadFilms(term){
  const box = $("#films");
  box.innerHTML = '<p class="msg">Loading…</p>';
  const base = 'collection:(feature_films) AND mediatype:(movies)';
  const query = term ? `${base} AND title:(${term})` : base;
  const url = 'https://archive.org/advancedsearch.php?q=' + encodeURIComponent(query) +
    '&fl[]=identifier&fl[]=title&fl[]=year&sort[]=downloads+desc&rows=24&output=json';
  try{
    const r = await fetch(url);
    const d = (await r.json()).response.docs;
    if(!d.length){ box.innerHTML = '<p class="msg">No results.</p>'; return; }
    box.innerHTML = d.map(f => `
      <div class="card" data-id="${esc(f.identifier)}" data-t="${esc(f.title)}">
        <img loading="lazy" src="https://archive.org/services/img/${encodeURIComponent(f.identifier)}" alt="">
        <p>${esc(f.title)}<small>${esc(f.year || "")}</small></p>
      </div>`).join("");
  }catch(e){ box.innerHTML = '<p class="msg">Could not load films. Check your connection.</p>'; }
}

async function loadTmdb(){
  if(!TMDB_KEY) return;
  try{
    const r = await fetch('https://api.themoviedb.org/3/trending/movie/week?api_key=' + TMDB_KEY);
    const d = (await r.json()).results || [];
    $("#tmdb").innerHTML = d.slice(0,12).map(m => `
      <div class="card">
        <img loading="lazy" src="https://image.tmdb.org/t/p/w342${esc(m.poster_path)}" alt="">
        <p>${esc(m.title)}<small>${esc((m.release_date||"").slice(0,4))} · ★ ${esc((m.vote_average||0).toFixed(1))}</small></p>
      </div>`).join("");
    $("#tmdbSec").hidden = false;
  }catch(e){}
}

$("#films").addEventListener("click", e => {
  const c = e.target.closest(".card"); if(!c) return;
  $("#pt").textContent = c.dataset.t;
  $("#pf").src = 'https://archive.org/embed/' + encodeURIComponent(c.dataset.id);
  $("#player").classList.add("on");
});
function closeP(){ $("#player").classList.remove("on"); $("#pf").src = ""; }
$("#close").onclick = closeP;
$("#player").addEventListener("click", e => { if(e.target.id === "player") closeP(); });
$("#go").onclick = () => loadFilms($("#q").value.trim());
$("#q").addEventListener("keydown", e => { if(e.key === "Enter") $("#go").click(); });

loadFilms(); loadTmdb();
</script>
</body>
</html>
